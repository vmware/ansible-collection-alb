name: Release collection to Red Hat Automation Hub (TEST ONLY)

on:
   push:
    branches:
      - token_based_publish

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Build Ansible collection
        run: ansible-galaxy collection build --force

      - name: Authenticate with Red Hat SSO (HARDCODED for testing)
        run: |
          ACCESS_TOKEN=$(curl 'https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token' --data-urlencode 'grant_type=client_credentials' --data-urlencode 'client_id=XXXXX' --data-urlencode 'client_secret=YYYYY' --data-urlencode 'scope=openid api.iam.service_accounts")

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          echo  $GITHUB_ENV

      - name: Publish to Red Hat Automation Hub
        run: |
          FILE=$(ls ./*.tar.gz | head -n 1)
          ansible-galaxy collection publish "$FILE" \
            --server https://console.redhat.com/api/automation-hub/ \
            --token $ACCESS_TOKEN
