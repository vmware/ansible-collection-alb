name: CI
on:
  push:
    branches:
      - "eng"
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-[a-z]+[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-[a-z]+"
  pull_request:

jobs:
  test:
    name: Test alb collection
    runs-on: ubuntu-latest
    env:
      ANSIBLE_SKIP_CONFLICT_CHECK: 1
      HOME: "/home/runner"
    strategy:
      matrix:
        ansible: [2.16.0]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: Configure pip retries
        run: |
          mkdir -p ~/.config/pip
          cat > ~/.config/pip/pip.conf <<EOF
          [global]
          timeout = 120
          retries = 10
          disable-pip-version-check = true
          EOF

      - name: Show Python and pip versions
        run: |
          python --version
          pip --version

      - name: Install ansible-base (v${{ matrix.ansible }})
        run: pip install https://github.com/ansible/ansible/archive/v${{ matrix.ansible }}.tar.gz

      - name: Build a collection tarball
        run: ansible-galaxy collection build

      - name: Install the collection tarball
        run: ansible-galaxy collection install *.tar.gz

      - name: Run unit tests
        working-directory: ${{ env.HOME }}/.ansible/collections/ansible_collections/vmware/alb
        run: |
          for i in 1 2 3; do
            echo "Unit test attempt $i..."
            ansible-test units --docker -v --color --truncate 0 --python 3.12 && exit 0
            echo "Attempt $i failed. Retrying in 20 seconds..."
            sleep 20
          done
          exit 1

      - name: Run sanity tests
        working-directory: ${{ env.HOME }}/.ansible/collections/ansible_collections/vmware/alb
        run: |
          for i in 1 2 3; do
            echo "Sanity test attempt $i..."
            ansible-test sanity --docker -v --color --truncate 0 --python 3.12 && exit 0
            echo "Attempt $i failed. Retrying in 20 seconds..."
            sleep 20
          done
          exit 1