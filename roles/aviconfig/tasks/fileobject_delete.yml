---
- name: Avi FileObject | Delete FileObject
  no_log: "{{ avi_role_config_log_mode | default('false') }}"
  vmware.alb.avi_fileobject:
    controller: "{{ avi_controller | default(omit) }}"
    username: "{{ avi_username | default(omit) }}"
    password: "{{ avi_password | default(omit) }}"
    tenant: "{{ item.tenant | default(omit) }}"
    api_version: "{{ api_version | default(omit) }}"
    avi_credentials: "{{ avi_credentials | default(omit) }}"
    api_context: "{{ avi_api_context | default(omit) }}"
    state: "{{ avi_role_state_mode }}"
    avi_api_update_method: "{{ item.avi_api_update_method | default(omit) }}"
    avi_api_patch_op: "{{ item.avi_api_patch_op | default(omit) }}"
    api_spec_detail: "{{ item.api_spec_detail | default(omit) }}"
    checksum: "{{ item.checksum | default(omit) }}"
    child_refs: "{{ item.child_refs | default(omit) }}"
    completed_events: "{{ item.completed_events | default(omit) }}"
    compressed: "{{ item.compressed | default(omit) }}"
    configpb_attributes: "{{ item.configpb_attributes | default(omit) }}"
    created: "{{ item.created | default(omit) }}"
    crl_info: "{{ item.crl_info | default(omit) }}"
    description: "{{ item.description | default(omit) }}"
    duration: "{{ item.duration | default(omit) }}"
    end_time: "{{ item.end_time | default(omit) }}"
    events: "{{ item.events | default(omit) }}"
    expires_at: "{{ item.expires_at | default(omit) }}"
    gslb_geodb_format: "{{ item.gslb_geodb_format | default(omit) }}"
    has_parent: "{{ item.has_parent | default(omit) }}"
    history: "{{ item.history | default(omit) }}"
    is_federated: "{{ item.is_federated | default(omit) }}"
    name: "{{ item.name | default(omit) }}"
    obj_state: "{{ item.obj_state | default(omit) }}"
    path: "{{ item.path | default(omit) }}"
    progress: "{{ item.progress | default(omit) }}"
    read_only: "{{ item.read_only | default(omit) }}"
    restrict_download: "{{ item.restrict_download | default(omit) }}"
    size: "{{ item.size | default(omit) }}"
    start_time: "{{ item.start_time | default(omit) }}"
    task_events: "{{ item.task_events | default(omit) }}"
    tenant_ref: "{{ item.tenant_ref | default(omit) }}"
    total_events: "{{ item.total_events | default(omit) }}"
    type: "{{ item.type | default(omit) }}"
    uuid: "{{ item.uuid | default(omit) }}"
    version: "{{ item.version | default(omit) }}"
  when:
    - (item.name | length > 0)
    - (not (item.system_default | default(false)))
    - (avi_config_state == "absent" or avi_role_state_mode == "absent")
    - (item.state | default("present") == avi_role_state_mode or avi_config_state == "absent")
  with_items: "{{ avi_role_cfg.fileobject | default([]) }}"
