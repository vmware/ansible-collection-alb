---
- name: Avi TechSupportProfile | Create or Update TechSupportProfile
  no_log: "{{ avi_role_config_log_mode | default(False) }}"
  vmware.alb.avi_techsupportprofile:
    controller: "{{ avi_controller | default(omit) }}"
    username: "{{ avi_username | default(omit) }}"
    password: "{{ avi_password | default(omit) }}"
    tenant: "{{ item.tenant | default(omit) }}"
    state: "{{ avi_role_state_mode }}"
    api_version: "{{ api_version | default(omit) }}"
    avi_credentials: "{{ avi_credentials | default(omit) }}"
    api_context: "{{ avi_api_context | default(omit) }}"
    avi_api_update_method: "{{ item.avi_api_update_method | default(omit) }}"
    avi_api_patch_op: "{{ item.avi_api_patch_op | default(omit) }}"
    archive_rules: "{{ item.archive_rules | default(omit) }}"
    collect_customer_files: "{{ item.collect_customer_files | default(omit) }}"
    event_params: "{{ item.event_params | default(omit) }}"
    file_size_threshold: "{{ item.file_size_threshold | default(omit) }}"
    max_disk_size_percent: "{{ item.max_disk_size_percent | default(omit) }}"
    min_free_disk_required: "{{ item.min_free_disk_required | default(omit) }}"
    no_of_techsupport_retentions: "{{ item.no_of_techsupport_retentions | default(omit) }}"
    simultaneous_invocations: "{{ item.simultaneous_invocations | default(omit) }}"
    task_timeout: "{{ item.task_timeout | default(omit) }}"
    uuid: "{{ item.uuid | default(omit) }}"
  when:
    - (avi_role_state_mode == "present" and avi_config_state == "present")
    - (item.state | default("present") == avi_role_state_mode or avi_config_state == "absent")
  with_items: "{{ avi_role_cfg.techsupportprofile | default([]) }}"
