---
- name: Cleanup avihost service
  ansible.builtin.service:
    name: avihost
    enabled: false
    state: stopped
  become: true
  ignore_errors: yes
  failed_when: true

- name: Copy Avi Host script to remote machine
  ansible.builtin.copy:
    src: "/etc/ansible/roles/avinetworks.avise/files/systemd/avi_host_server.py"
    dest: /usr/sbin/avi_host_server.py
    mode: "0755"
  become: true

- name: Systemd | Deploy the avihost service
  ansible.builtin.copy:
    src: "/etc/ansible/roles/avinetworks.avise/files/systemd/avihost.service"
    dest: /etc/systemd/system/avihost.service
    mode: "0644"
  become: true

- name: Systemd | Deploy the avihost service script
  ansible.builtin.copy:
    src: "/etc/ansible/roles/avinetworks.avise/files/systemd/avihost_service_script.sh"
    dest: /etc/systemd/system/avihost_service_script.sh
    mode: "0755"
  become: true
  