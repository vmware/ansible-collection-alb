---
# @AI-Modified: 2026-01-23 - Changed hardcoded absolute paths to relative paths and added owner/group to address security hotspots
- name: Cleanup avihost service
  ansible.builtin.service:
    name: avihost
    enabled: false
    state: stopped
  become: true
  failed_when: false

- name: Copy Avi Host script to remote machine
  ansible.builtin.copy:
    src: "systemd/avi_host_server.py"
    dest: /usr/sbin/avi_host_server.py
    mode: "0750"
    owner: root
    group: root
    validate: "python3 -m py_compile %s"
  become: true

# @AI-Modified: 2026-01-23 - Changed mode to 0640 to address ansible:S2612
- name: Systemd | Deploy the avihost service
  ansible.builtin.copy:
    src: "systemd/avihost.service"
    dest: /etc/systemd/system/avihost.service
    mode: "0640"
    owner: root
    group: root
  become: true

- name: Systemd | Deploy the avihost service script
  ansible.builtin.copy:
    src: "systemd/avihost_service_script.sh"
    dest: /etc/systemd/system/avihost_service_script.sh
    mode: "0750"
    owner: root
    group: root
    validate: "/bin/bash -n %s"
  become: true
