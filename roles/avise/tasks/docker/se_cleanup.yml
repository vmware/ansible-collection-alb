---
- name: Checks for blocking SE
  ansible.builtin.include_tasks: check_cloud.yml
  when: se_action == "cleanup"

- name: Cleanup avise_watcher service
  when: ansible_service_mgr != "systemd"
  become: true
  block:
    - name: Avi SE | Docker | Cleanup | Stop avise_watcher service
      ansible.builtin.service:
        name: avise_watcher
        enabled: false
        state: stopped
    - name: Remove avise file
      ansible.builtin.file:
        path: /usr/sbin/avise
        state: absent
    - name: Remove avise service file
      ansible.builtin.file:
        path: /etc/init.d/avise
        state: absent
    - name: Remove avise_watcher.sh
      ansible.builtin.file:
        path: /etc/init.d/avise_watcher.sh
        state: absent
    - name: Remove avise_watcher
      ansible.builtin.file:
        path: /etc/init.d/avise_watcher
        state: absent
    - name: Avi SE | Services | init.d | Deploying avise_watcher rc links
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/rc0.d/K99avise_watcher
        - /etc/rc1.d/K99avise_watcher
        - /etc/rc2.d/S99avise_watcher
        - /etc/rc3.d/S99avise_watcher
        - /etc/rc4.d/S99avise_watcher
        - /etc/rc5.d/S99avise_watcher
        - /etc/rc6.d/K99avise_watcher

- name: Cleanup avise_watcher service
  when: ansible_service_mgr == "systemd"
  become: true
  block:
    - name: Cleanup avise_watcher service
      ansible.builtin.service:
        name: avise
        enabled: false
        state: stopped
      failed_when: false
    - name: Remove avise file
      ansible.builtin.file:
        path: /usr/sbin/avise
        state: absent
      failed_when: false
    - name: Remove service file
      ansible.builtin.file:
        path: /etc/systemd/system/avise.service
        state: absent
      failed_when: false

- name: Cleanup avihost service
  when: ansible_service_mgr == "systemd" and se_action == "cleanup"
  become: true
  block:
    - name: Cleanup avihost service
      ansible.builtin.service:
        name: avihost
        enabled: false
        state: stopped
      failed_when: false
    - name: Remove avihost server file
      ansible.builtin.file:
        path: /usr/sbin/avi_host_server.py
        state: absent
      failed_when: false
    - name: Remove service file
      ansible.builtin.file:
        path: /etc/systemd/system/avihost.service
        state: absent
      failed_when: false
    - name: Remove service script file
      ansible.builtin.file:
        path: /etc/systemd/system/avihost_service_script.sh
        state: absent
      failed_when: false

- name: Get list of running se containers
  when: se_action == "cleanup"
  become: true
  block:
    - name: Get list of running se containers
      ansible.builtin.command: "{{ se_deploy_type }} ps -q -f name=avise"
      changed_when: false
      register: se_running_containers
    - name: Stop and Remove the containers
      ansible.builtin.shell: >
        set -o pipefail && \
        {{ se_deploy_type }} stop {{ item }} && {{ se_deploy_type }} rm -f {{ item }}
      args:
        executable: /bin/bash
      changed_when: false
      loop: "{{ se_running_containers.stdout_lines }}"
      when: se_running_containers.stdout_lines | length > 0
    - name: Get list of docker images
      ansible.builtin.shell: >
        set -o pipefail && \
        {{ se_deploy_type }} images | grep avinetworks/se | grep {{ se_version }} | awk '{print $3}'
      args:
        executable: /bin/bash
      changed_when: false
      register: docker_images
      when: se_action == "cleanup"
      failed_when: false
    - name: Remove the images
      ansible.builtin.command: "{{ se_deploy_type }} rmi -f {{ item }}"
      changed_when: false
      loop: "{{ docker_images.stdout_lines | default([]) }}"
      when: docker_images.stdout_lines is defined and docker_images.stdout_lines | length > 0

- name: Clean up other files
  become: true
  block:
    - name: Clean up other files
      ansible.builtin.file:
        path: "{{ se_package_dest }}"
        state: absent
      failed_when: false

- name: Clean up se files
  ansible.builtin.file:
    path: "{{ item.split(':') | map('regex_search', '(.*)opt/avi/se/(.*)') | select('string') | first }}"
    state: absent
  loop: "{{ se_existing_run_params.split() | map('regex_search', '(.*)opt/avi/se/(.*)') | select('string') | list }}"
  when: se_existing_run_params is defined and se_existing_ver is defined and se_existing_ver == se_version
  failed_when: false
  become: true
