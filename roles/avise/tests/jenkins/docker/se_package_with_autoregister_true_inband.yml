# ansible-playbook se_package_with_autoregister_true.yml -i 10.70.160.54, --ask-pass --ask-become-pass -e
# "controller_ip=10.70.160.51 controller_username=admin controller_password=AviNetworks123!" -u root --tags ubuntu
---
- name: Install python2
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: 'Install python2'
      ansible.builtin.raw: sudo apt-get -y install python-simplejson
      changed_when: false
      failed_when: false

- name: Install Avi SE
  hosts: all
  become: true
  pre_tasks:
    - name: Enable ipv4 forwarding
      ansible.posix.sysctl:
        name: "net.ipv4.ip_forward"
        value: 1
        sysctl_set: true
        state: present
        reload: true
    - name: Deactivate and stop Firewalld
      ansible.builtin.service:
        name: "firewalld"
        state: "stopped"
        enabled: false
      when: ansible_distribution == "Redhat"
  roles:
    - role: avinetworks.avisdk
    - role: avinetworks.docker
    - role: avinetworks.avise
      se_leader_ctl_ip: "{{ controller_ip }}"
      se_leader_ctl_username: "{{ controller_username }}"
      se_leader_ctl_password: "{{ controller_password }}"
      se_package_deploy: true
      se_package_source: se_docker.tgz
      se_cores: 4
      se_memory_gb: 8
      se_inband_mgmt: true
      se_dpdk: true
      se_destination_disk: /avi/
      se_disk_gb: 12
      se_logs_disk_path: /avi/logs/
      se_logs_disk_gb: 12
