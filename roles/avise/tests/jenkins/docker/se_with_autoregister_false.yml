# ansible-playbook se_with_autoregister_false.yml -i 10.70.160.54, --ask-pass --ask-become-pass -e
# "controller_ip=10.70.160.51 controller_username=admin controller_password=AviNetworks123!" -u root
---
- name: Install dependencies
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: 'Install python2'
      ansible.builtin.raw: sudo apt-get -y install python-simplejson
      changed_when: false
      failed_when: false

- name: Install Avi SE
  hosts: all
  become: true
  pre_tasks:
    - name: Get Controller information
      ansible.builtin.uri:
        url: "https://{{ se_leader_ctl_ip }}/api/initial-data"
        validate_certs: false
        return_content: true
      register: controller_initial_data
      delegate_to: localhost
    - name: Enable ipv4 forwarding
      ansible.posix.sysctl:
        name: "net.ipv4.ip_forward"
        value: 1
        sysctl_set: true
        state: present
        reload: true
    - name: Deactivate and stop Firewalld
      ansible.builtin.service:
        name: "firewalld"
        state: "stopped"
        enabled: false
      when: ansible_distribution == "Redhat"
    - name: Include autoregistration tasks
      ansible.builtin.include_tasks: autoregistration.yml
  vars:
    se_leader_ctl_ip: "{{ controller_ip }}"
    se_leader_ctl_username: "{{ controller_username }}"
    se_leader_ctl_password: "{{ controller_password }}"
    se_tenant: admin
    se_cloud_name: Default-Cloud
  roles:
    - role: avinetworks.docker
    - role: avinetworks.avise
      se_version: "{{ controller_initial_data.json.version.Tag }}"
      se_leader_ctl_ip: "{{ controller_ip }}"
      se_auth_token: "{{ se_auth_token }}"
      se_cores: 4
      se_memory_gb: 8
      se_disk_gb: 12
