# "controller_ip=10.70.160.51 controller_username=admin controller_password=AviNetworks123!" -u root
---
- name: Install dependencies
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: 'Install python2'
      ansible.builtin.raw: sudo apt-get -y install python-simplejson
      changed_when: false

- name: Install VMware NSX-T
  hosts: all
  become: true
  pre_tasks:
    - name: Enable ipv4 forwarding
      ansible.posix.sysctl:
        name: "net.ipv4.ip_forward"
        value: 1
        sysctl_set: true
        state: present
        reload: true
    - name: Deactivate and stop Firewalld
      ansible.builtin.service:
        name: "firewalld"
        state: "stopped"
        enabled: false
      when: ansible_distribution == "Redhat"
    - name: Get Controller information
      ansible.builtin.uri:
        url: "https://{{ se_leader_ctl_ip }}/api/initial-data"
        validate_certs: false
      register: controller_initial_data
      delegate_to: localhost
  roles:
    - role: avinetworks.avisdk
    - role: avinetworks.docker
    - role: avinetworks.avise
      se_version: "{{ controller_initial_data.json.version.Tag }}"
      se_leader_ctl_ip: "{{ controller_ip }}"
      se_leader_ctl_username: "{{ controller_username }}"
      se_leader_ctl_password: "{{ controller_password }}"
      se_cloud_name: "{{ cloud_name }}"
      se_tenant: "{{ tenant_name }}"
      se_cores: 4
      se_memory_gb: 8
      se_disk_gb: 12
