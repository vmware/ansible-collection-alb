---
# Validate if controller is up and running
# @AI-Modified: 2026-01-23 - Made validate_certs configurable to address SonarQube security warning
- name: Avi Controller | CSP | Validate controller service
  ansible.builtin.uri:
    url: 'https://{{ con_csp_mgmt_ip }}/#!/login'
    validate_certs: "{{ avi_validate_certs | default(false) }}"
  retries: 120
  delay: 30
  register: task_result
  until: task_result.status == 200
  ignore_errors: true
  delegate_to: localhost
