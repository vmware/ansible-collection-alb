---
# @AI-Modified: 2026-01-23 - Added owner/group and changed mode to address ansible:S2612
- name: Avi Controller | Services | Install the Avi Controller service file | New
  ansible.builtin.template:
    src: avicontroller.j2
    dest: /usr/sbin/avicontroller
    mode: "0750"
    owner: root
    group: root
  notify: Avi Controller | Services | Restart the avicontroller service

# @AI-Modified: 2026-01-23 - Added validation to address security hotspot for dynamic include
- name: Avi Controller | Services | Validate service manager
  ansible.builtin.assert:
    that:
      - ansible_service_mgr is defined
      - ansible_service_mgr in ['systemd', 'sysvinit', 'upstart', 'openrc', 'service']
    fail_msg: "Unsupported or invalid service manager: {{ ansible_service_mgr | default('undefined') }}"

- name: Avi Controller | Services | Install the Avi Controller service | systemd
  ansible.builtin.include_tasks: "systemd/install.yml"
  when: ansible_service_mgr == 'systemd'

- name: Avi Controller | Services | Install the Avi Controller service | sysvinit
  ansible.builtin.include_tasks: "sysvinit/install.yml"
  when: ansible_service_mgr == 'sysvinit'

- name: Avi Controller | Services | Install the Avi Controller service | upstart
  ansible.builtin.include_tasks: "upstart/install.yml"
  when: ansible_service_mgr == 'upstart'

- name: Avi Controller | Services | Install the Avi Controller service | openrc
  ansible.builtin.include_tasks: "openrc/install.yml"
  when: ansible_service_mgr == 'openrc'

- name: Avi Controller | Services | Install the Avi Controller service | service
  ansible.builtin.include_tasks: "service/install.yml"
  when: ansible_service_mgr == 'service'

- name: Avi Controller | Services | Start the service since it's not running | {{ ansible_service_mgr }}
  ansible.builtin.service:
    name: avicontroller
    enabled: true
    state: started
  when: not con_desired_running.stdout
