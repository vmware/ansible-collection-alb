---
# This set of tasks is only used when con_package_deploy is true
# @AI-Modified: 2026-01-23 - Added owner/group and changed mode to address ansible:S2612
- name: Avi Controller | Docker | Deploy the image from the package
  ansible.builtin.copy:
    src: "{{ con_package_source }}"
    dest: "{{ con_package_dest }}"
    mode: "0640"
    owner: root
    group: root

# @AI-Modified: 2026-01-23 - Added input validation to address security hotspot
- name: Avi Controller | Docker | Validate package destination path
  ansible.builtin.assert:
    that:
      - con_package_dest is defined
      - con_package_dest | length > 0
      - "'..' not in con_package_dest"
      - con_package_dest is match('^[a-zA-Z0-9/_.-]+$')
    fail_msg: "Invalid package destination path: {{ con_package_dest }}"

- name: Avi Controller | Docker | Load the image from the package
  ansible.builtin.shell:
    cmd: docker load -q -i "{{ con_package_dest }}"
  args:
    executable: /bin/bash
  changed_when: false
  register: con_load_docker_image_raw

- name: Avi Controller | Docker | Extract version from loaded image
  ansible.builtin.set_fact:
    con_load_docker_image_version: "{{ con_load_docker_image_raw.stdout | regex_search(':(\\S+)$', '\\1') | first | default('') }}"

- name: Set con_version and con_image facts
  ansible.builtin.set_fact:
    con_version: "{{ con_load_docker_image_version }}"
    con_image: "avinetworks/controller:{{ con_load_docker_image_version }}"
