---
# @AI-Modified: 2026-01-23 - Added input validation to address security hotspots
# check system against minimum requirements
- name: Avi Controller | Requirements | Check for docker
  ansible.builtin.command: "which docker"
  register: docker
  changed_when: false

- name: Avi Controller | Requirements | Get docker version
  ansible.builtin.command: docker -v
  register: docker_version_raw
  changed_when: false

- name: Avi Controller | Requirements | Parse docker version
  ansible.builtin.set_fact:
    docker_version:
      stdout: "{{ docker_version_raw.stdout | regex_search('Docker version ([0-9.]+)', '\\1') | first | default('0.0.0') }}"

- name: Avi Controller | Requirements | Check docker version
  ansible.builtin.assert:
    that:
      - docker_version.stdout is version_compare('1.10.2', '>=')

- name: Avi Controller | Requirements | Verify con_version not "latest"
  ansible.builtin.assert:
    that:
      - con_version != "latest"

- name: Avi Controller | Requirements | Get the management device name
  when: con_dev_name == None
  block:
    - name: Avi Controller | Requirements | Validate controller IP format
      ansible.builtin.assert:
        that:
          - con_controller_ip is defined
          - con_controller_ip | length > 0
          - con_controller_ip is match('^[0-9a-fA-F.:]+$')
        fail_msg: "Invalid controller IP format: {{ con_controller_ip }}"

    - name: Avi Controller | Requirements | Get the management device name | ip addr
      ansible.builtin.command: ip addr show
      register: con_ip_addr_output
      changed_when: false

    - name: Avi Controller | Requirements | Parse management device name
      ansible.builtin.set_fact:
        con_mgmt_device_parsed: "{{ con_ip_addr_output.stdout_lines | select('search', con_controller_ip) | first | default('') | split() | last | default('') }}"

    - name: Avi Controller | Requirements | Set the management device name | ip addr
      ansible.builtin.set_fact:
        con_dev_name: "{{ con_mgmt_device_parsed }}"
        AVICONTROLLER_DEV_NAME: "{{ con_mgmt_device_parsed }}"

- name: Avi Controller | Requirements | Set max_cores and memory limits of environment
  ansible.builtin.set_fact:
    con_max_cores: "{{ ansible_processor_cores * ansible_processor_count * ansible_processor_threads_per_core }}"
    con_ansible_memtotal_gb: "{{ ansible_memtotal_mb // 1024 }}"

- name: Avi Controller | Requirements | Get Ansible processor info
  ansible.builtin.debug:
    msg: >-
      con_max_cores {{ con_max_cores }}
      ansible processor cores {{ ansible_processor_cores }}
      count {{ ansible_processor_count }}
      threads {{ ansible_processor_threads_per_core }}
  when: not con_skip_requirements

- name: Avi Controller | Requirements | Validate Parameters
  ansible.builtin.assert:
    that:
      - "ansible_memtotal_mb >= 12288"
      - "con_memory_gb|int <= con_ansible_memtotal_gb|int"
      - "con_max_cores|int >= 4"
      - "con_cores|int <= con_max_cores|int"
  when: not con_skip_requirements

- name: Avi Controller | Requirements | Fresh install steps
  ansible.builtin.include_tasks: fresh_install.yml
  when: con_fresh_install

- name: Avi Controller | Requirements | Validate disk paths
  ansible.builtin.assert:
    that:
      - item is match('^[a-zA-Z0-9/_.-]+$')
      - "'..' not in item"
    fail_msg: "Invalid disk path: {{ item }}"
  when: item != None
  loop:
    - "{{ con_disk_path }}"
    - "{{ con_metrics_disk_path }}"
    - "{{ con_logs_disk_path }}"

# @AI-Modified: 2026-01-23 - Added owner/group and changed mode to address ansible:S2612
- name: Avi Controller | Requirements | Create directories for controller
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: root
    group: root
  when: item != None
  loop:
    - "{{ con_disk_path }}"
    - "{{ con_metrics_disk_path }}"
    - "{{ con_logs_disk_path }}"

- name: Avi Controller | Requirements | Get disk space on controller disk path
  ansible.builtin.stat:
    path: "{{ con_disk_path }}"
  register: con_disk_path_stat
  when: con_disk_path != None

- name: Avi Controller | Requirements | Get filesystem info for controller disk path
  ansible.builtin.command:
    cmd: "df -BG {{ con_disk_path }}"
  register: con_disk_path_df
  changed_when: false
  when: con_disk_path != None and con_disk_path_stat.stat.exists

- name: Avi Controller | Requirements | Parse disk space for controller disk path
  ansible.builtin.set_fact:
    con_disk_path_space:
      stdout: "{{ con_disk_path_df.stdout_lines[1] | regex_search('([0-9]+)G\\s+[0-9]+%', '\\1') | first | default('0') }}"
  when: con_disk_path != None and con_disk_path_stat.stat.exists

- name: Avi Controller | Requirements | Get disk space on controller logs disk path
  ansible.builtin.stat:
    path: "{{ con_logs_disk_path }}"
  register: con_logs_disk_path_stat
  when: con_logs_disk_path != None

- name: Avi Controller | Requirements | Get filesystem info for controller logs disk path
  ansible.builtin.command:
    cmd: "df -BG {{ con_logs_disk_path }}"
  register: con_logs_disk_path_df
  changed_when: false
  when: con_logs_disk_path != None and con_logs_disk_path_stat.stat.exists

- name: Avi Controller | Requirements | Parse disk space for controller logs disk path
  ansible.builtin.set_fact:
    con_logs_disk_path_space:
      stdout: "{{ con_logs_disk_path_df.stdout_lines[1] | regex_search('([0-9]+)G\\s+[0-9]+%', '\\1') | first | default('0') }}"
  when: con_logs_disk_path != None and con_logs_disk_path_stat.stat.exists

- name: Avi Controller | Requirements | Get disk space on controller metrics disk path
  ansible.builtin.stat:
    path: "{{ con_metrics_disk_path }}"
  register: con_metrics_disk_path_stat
  when: con_metrics_disk_path != None

- name: Avi Controller | Requirements | Get filesystem info for controller metrics disk path
  ansible.builtin.command:
    cmd: "df -BG {{ con_metrics_disk_path }}"
  register: con_metrics_disk_path_df
  changed_when: false
  when: con_metrics_disk_path != None and con_metrics_disk_path_stat.stat.exists

- name: Avi Controller | Requirements | Parse disk space for controller metrics disk path
  ansible.builtin.set_fact:
    con_metrics_disk_path_space:
      stdout: "{{ con_metrics_disk_path_df.stdout_lines[1] | regex_search('([0-9]+)G\\s+[0-9]+%', '\\1') | first | default('0') }}"
  when: con_metrics_disk_path != None and con_metrics_disk_path_stat.stat.exists

- name: Avi Controller | Requirements | Check if there is enough space for controller disk path
  when: not con_skip_requirements
  block:
    - name: Avi Controller | Requirements | Check if there is enough space for controller disk path
      ansible.builtin.assert:
        that:
          - con_disk_gb != None
          - con_disk_path_space.stdout|int > con_disk_gb|int
      when: con_disk_path != None
    - name: Avi Controller | Requirements | Check if there is enough space for controller metrics disk path
      ansible.builtin.assert:
        that:
          - con_metrics_disk_gb != None
          - con_metrics_disk_path_space.stdout|int > con_metrics_disk_gb|int
      when: con_metrics_disk_path != None
    - name: Avi Controller | Requirements | Check if there is enough space for controller logs disk path
      ansible.builtin.assert:
        that:
          - con_logs_disk_gb != None
          - con_logs_disk_path_space.stdout|int > con_logs_disk_gb|int
      when: con_logs_disk_path != None
